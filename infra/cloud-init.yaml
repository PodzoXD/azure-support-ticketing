#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2

write_files: 
  - path: /opt/helpdesk/docker-compose.override.yml
    content: |
      services:
        mariadb:
          restart: unless-stopped
        redis:
          restart: unless-stopped
        frappe:
          restart: unless-stopped
runcmd:
  - usermod -aG docker azureuser 
  - mkdir -p /opt/helpdesk
  - cd /opt/helpdesk/ && wget --output-document=docker-compose.yml https://raw.githubusercontent.com/frappe/helpdesk/develop/docker/docker-compose.yml 
  - cd /opt/helpdesk/ && wget --output-document=init.sh https://raw.githubusercontent.com/frappe/helpdesk/develop/docker/init.sh
  - cd /opt/helpdesk/ && sed -i '1a printf "[client]\\nskip-ssl\\n" > ~/.my.cnf' init.sh
  - cd /opt/helpdesk && docker compose up -d 
